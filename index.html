<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Étudiants</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <h1 class="text-center mb-4"> Gestion des Étudiants</h1>

        <!-- SECTION 1 : LISTE DES ÉTUDIANTS -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white">
                <h2 class="h5 mb-0">Liste des étudiants</h2>
            </div>
            <div class="card-body">
                <button id="btn-liste" class="btn btn-primary mb-3">Afficher la liste</button>
                <div id="resultat-liste"></div>
            </div>
        </div>
<!-- SECTION : RECHERCHE D'ÉTUDIANTS -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-secondary text-white">
                <h2 class="h5 mb-0">🔍 Rechercher un étudiant</h2>
            </div>
            <div class="card-body">
                <div class="input-group mb-3">
                    <input type="text" id="recherche_input" class="form-control" placeholder="Entrez un nom ou un prénom...">
                    <button id="btn-recherche" class="btn btn-secondary">Rechercher</button>
                </div>
                <div id="resultat-recherche-etudiant"></div>
            </div>
        </div>
        <!-- SECTION 2 : CONSULTER UN ÉTUDIANT -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-info text-white">
                <h2 class="h5 mb-0">Consulter un étudiant (Matières et Notes)</h2>
            </div>
            <div class="card-body">
                <div class="input-group mb-3">
                    <select id="select_etudiant" class="form-select">
                        <option value="">-- Choisir un étudiant --</option>
                    </select>
                    <button id="btn-rechercher" class="btn btn-info text-white">Rechercher</button>
                </div>
                <div id="resultat-recherche"></div>
            </div>
        </div>

        <!-- SECTION 3 : AJOUTER UN ÉTUDIANT -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-success text-white">
                <h2 class="h5 mb-0">Ajouter un étudiant</h2>
            </div>
            <div class="card-body">
                <form id="form-etudiant">
                    <div class="row">
                        <div class="col-md-4 mb-2">
                            <input type="text" id="nom" class="form-control" placeholder="Nom" required>
                        </div>
                        <div class="col-md-4 mb-2">
                            <input type="text" id="prenom" class="form-control" placeholder="Prénom" required>
                        </div>
                        <div class="col-md-4 mb-2">
                            <input typeemail" id="email" class="form-control" placeholder="Email" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success">Ajouter l'étudiant</button>
                </form>
                <div id="resultat-etudiant" class="mt-3"></div>
            </div>
        </div>

        <!-- SECTION 4 : AJOUTER UNE NOTE -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-warning text-dark">
                <h2 class="h5 mb-0">Ajouter une note</h2>
            </div>
            <div class="card-body">
                <form id="form-note">
                    <div class="row">
                        <div class="col-md-4 mb-2">
                            <select id="note_etudiant_id" class="form-select" required>
                                <option value="">-- Choisir un étudiant --</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-2">
                            <select id="note_matiere_id" class="form-select" required>
                                <option value="">-- Choisir une matière --</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-2">
                            <input type="number" step="0.01" id="note" class="form-control" placeholder="Note (ex: 15.5)" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-warning">Ajouter la note</button>
                </form>
                <div id="resultat-note" class="mt-3"></div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS (pour la modale plus tard) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Notre script -->
    <!-- Modale pour la modification -->
    <div class="modal fade" id="modifierModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Modifier l'étudiant</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="edit_id">
                    <input type="text" id="edit_nom" class="form-control mb-2" placeholder="Nom">
                    <input type="text" id="edit_prenom" class="form-control mb-2" placeholder="Prénom">
                    <input type="email" id="edit_email" class="form-control mb-2" placeholder="Email">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                    <button type="button" class="btn btn-primary" id="btn-save-edit">Enregistrer</button>
                </div>
            </div>
        </div>
    </div>
<script src="script.js"></script>
</body>
</html>
